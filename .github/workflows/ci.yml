name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: tapeverify-backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn verify
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: tapeverify-frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: tapeverify-frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
