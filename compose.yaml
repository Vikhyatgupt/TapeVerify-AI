services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tapeverify
      MYSQL_USER: ${MYSQL_USER:-tapeverify}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "3306:3306"
    volumes:
      - tapeverify_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./tapeverify-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tapeverify?useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      DB_USER: ${MYSQL_USER:-tapeverify}
      DB_PASS: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in your environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in your environment}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./tapeverify-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  tapeverify_mysql_data:
